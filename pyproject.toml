[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calmvoice"
version = "0.1.0"
description = "Voice-enabled mental-health support companion (local Llama + RAG) with a safety gate first"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krishna Annavaram" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pydantic>=2.5"]

[project.optional-dependencies]
# Dense sentence embeddings (MiniLM) instead of the offline hashing embedder.
embeddings = ["sentence-transformers>=2.6"]
# FAISS backend for large indexes. The default backend is NumPy.
faiss = ["faiss-cpu>=1.7"]
# Browser voice: Whisper speech-to-text and gTTS text-to-speech.
voice = ["faster-whisper>=1.0", "gTTS>=2.5"]
# Streamlit page with browser microphone input and audio playback.
ui = ["streamlit>=1.40"]
# Optional learned crisis classifier next to the keyword rules.
ml = ["scikit-learn>=1.3"]
dev = ["pytest>=8", "scikit-learn>=1.3"]

[project.scripts]
calmvoice = "calmvoice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
calmvoice = ["data/*.json", "data/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
